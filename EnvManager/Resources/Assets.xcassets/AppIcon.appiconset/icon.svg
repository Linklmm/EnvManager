<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Main background gradient: deep blue to purple -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#553c9a;stop-opacity:1" />
    </linearGradient>

    <!-- Glossy highlight gradient -->
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Terminal window gradient -->
    <linearGradient id="terminalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Inner shadow for depth -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- macOS-style rounded rectangle background -->
  <!-- The icon has a slight 3D perspective with rounded corners -->
  <rect x="120" y="120" width="784" height="784" rx="180" ry="180"
        fill="url(#bgGradient)" filter="url(#dropShadow)"/>

  <!-- Glossy highlight overlay -->
  <rect x="120" y="120" width="784" height="392" rx="180" ry="180"
        fill="url(#glossGradient)"/>

  <!-- Terminal window -->
  <!-- Positioned centrally, with macOS window style -->
  <g transform="translate(200, 260)">
    <!-- Window frame -->
    <rect x="0" y="0" width="624" height="340" rx="12" ry="12"
          fill="url(#terminalGradient)" filter="url(#dropShadow)"/>

    <!-- Window title bar -->
    <rect x="0" y="0" width="624" height="40" rx="12" ry="12" fill="#3d3d3d"/>
    <rect x="0" y="28" width="624" height="12" fill="#3d3d3d"/>

    <!-- Window buttons (close, minimize, maximize) -->
    <circle cx="24" cy="20" r="8" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="8" fill="#ffbd2e"/>
    <circle cx="72" cy="20" r="8" fill="#27c93f"/>

    <!-- Terminal content area -->
    <rect x="12" y="52" width="600" height="276" fill="#1e1e1e"/>

    <!-- Command prompt line -->
    <text x="32" y="90" font-family="SF Mono, Menlo, monospace" font-size="28" fill="#27c93f">$</text>
    <text x="60" y="90" font-family="SF Mono, Menlo, monospace" font-size="28" fill="#ffffff">env</text>

    <!-- Output text -->
    <text x="32" y="130" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#98a4b8">PATH=/usr/local/bin</text>
    <text x="32" y="165" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#98a4b8">NODE_ENV=dev</text>
    <text x="32" y="200" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#98a4b8">PYTHONPATH=...</text>

    <!-- Blinking cursor -->
    <rect x="32" y="225" width="16" height="24" fill="#27c93f" opacity="0.8"/>
  </g>

  <!-- Gear/Settings icon at bottom -->
  <g transform="translate(512, 720)">
    <!-- Gear circle -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.9"/>

    <!-- Gear teeth (8 teeth) -->
    <g fill="#ffffff" opacity="0.9">
      <rect x="-12" y="-72" width="24" height="32" rx="4"/>
      <rect x="-12" y="40" width="24" height="32" rx="4"/>
      <rect x="-72" y="-12" width="32" height="24" rx="4"/>
      <rect x="40" y="-12" width="32" height="24" rx="4"/>

      <!-- Diagonal teeth -->
      <rect x="-56" y="-56" width="24" height="24" rx="4" transform="rotate(45 -44 -44)"/>
      <rect x="32" y="-56" width="24" height="24" rx="4" transform="rotate(45 44 -44)"/>
      <rect x="-56" y="32" width="24" height="24" rx="4" transform="rotate(45 -44 44)"/>
      <rect x="32" y="32" width="24" height="24" rx="4" transform="rotate(45 44 44)"/>
    </g>

    <!-- Center hole -->
    <circle cx="0" cy="0" r="20" fill="url(#bgGradient)"/>
  </g>

  <!-- ENV text badge -->
  <g transform="translate(512, 180)">
    <text x="0" y="0" font-family="SF Pro Display, Helvetica Neue, sans-serif"
          font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle"
          opacity="0.95">ENV</text>
  </g>
</svg>